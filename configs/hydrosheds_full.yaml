download_root: data/raw_external/hydrosheds_full
unpack_root: data/raw_external/hydrosheds_full/unpacked

prefer_formats:
  hydrobasins: shapefile_or_gpkg_if_available
  hydrorivers: geodatabase
  hydroatlas: geodatabase

download_products:
  hydrobasins_standard_full: true
  hydrobasins_custom_lakes_full: true
  hydrobasins_pour_points_full: true
  hydrorivers_global: true
  hydrorivers_continental_fallback: true
  basinatlas_global_gdb: true
  riveratlas_global_gdb: true
  lakeatlas_global_gdb: true
  shapefile_fallbacks: true
  hydroatlas_documentation: true

unpack_policy:
  hydrobasins: true
  hydrorivers: true
  hydroatlas_gdb: true
  hydroatlas_shapefile_fallbacks: false
  documentation: false

disk_safety:
  min_free_space_gb: 80
  allow_continue_if_space_unknown: false

official_pages:
  hydrobasins: https://www.hydrosheds.org/products/hydrobasins
  hydrorivers: https://www.hydrosheds.org/products/hydrorivers
  hydroatlas: https://www.hydrosheds.org/hydroatlas

manual_download_urls:
  basinatlas_global_gdb: https://ndownloader.figshare.com/files/20082137
  basinatlas_global_shp_fallback: https://ndownloader.figshare.com/files/20087237
  riveratlas_global_gdb: https://ndownloader.figshare.com/files/20087321
  riveratlas_global_shp_fallback: https://ndownloader.figshare.com/files/20087486
  lakeatlas_global_gdb: https://ndownloader.figshare.com/files/35959544
  lakeatlas_global_shp_fallback: https://ndownloader.figshare.com/files/35959547
  hydroatlas_technical_documentation: https://data.hydrosheds.org/file/technical-documentation/HydroATLAS_TechDoc_v10_1.pdf
  basinatlas_catalog_pdf: https://data.hydrosheds.org/file/technical-documentation/BasinATLAS_Catalog_v10.pdf
  riveratlas_catalog_pdf: https://data.hydrosheds.org/file/technical-documentation/RiverATLAS_Catalog_v10.pdf
  lakeatlas_catalog_pdf: https://data.hydrosheds.org/file/technical-documentation/LakeATLAS_Catalog_v10.pdf
