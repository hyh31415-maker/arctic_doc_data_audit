[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arctic-doc-data-audit"
version = "0.1.0"
description = "Reproducible data acquisition and preprocessing audit for Arctic river DOC, CDOM, discharge, optical proxy, and hydroclimate data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "requests>=2.31",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gee = ["earthengine-api>=0.1.390"]
geo = ["geopandas>=0.14", "pyogrio>=0.7", "shapely>=2.0", "pyproj>=3.6"]

[project.scripts]
arctic-doc-data-audit = "arctic_doc_data_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
